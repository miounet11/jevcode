# JevCode 站点 nginx 配置
# 放置位置：/etc/nginx/sites-available/jevcode.conf
# 启用：ln -s /etc/nginx/sites-available/jevcode.conf /etc/nginx/sites-enabled/
#
# 前置条件：
#   1. 静态文件已上传到 /var/www/jevcode/current
#   2. 证书已签发（certbot 会自动改写本文件的 ssl_certificate 行）
#      首次部署可先只用 80 端口那段，签完证书后再启用 443

server {
    listen 80;
    listen [::]:80;
    server_name www.jevcode.ai jevcode.ai;

    # certbot 的 ACME 校验目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.jevcode.ai$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jevcode.ai;

    # 裸域跳转到 www，避免重复内容
    ssl_certificate     /etc/letsencrypt/live/www.jevcode.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.jevcode.ai/privkey.pem;

    return 301 https://www.jevcode.ai$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.jevcode.ai;

    root /var/www/jevcode/current;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/www.jevcode.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.jevcode.ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               image/svg+xml application/wasm;

    charset utf-8;

    # 带内容哈希的静态资源，长期缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(svg|woff2?|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # sitemap 和 robots 不缓存过久，便于爬虫及时看到更新
    location ~ ^/(sitemap.*\.xml|robots\.txt)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # 目录自动查找 index.html（Astro directory 格式）
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # HTML 不缓存，保证部署后立即生效
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
