# JevCode 站点 nginx 配置
# 目标服务器：23.95.243.52 (Ubuntu 24.04, nginx/1.24.0)
# 放置位置：/etc/nginx/sites-available/jevcode.conf
#
# 注意：本服务器上已有 xiaoshuo（:80 default_server，server_name _）和
# manhua-kaifa（:18765）两个站点。本配置用显式 server_name 精确匹配，
# 因此不会与它们冲突——nginx 会优先选择 server_name 精确匹配的 server 块。
#
# 证书：站点走 Cloudflare 代理，浏览器看到的是 Cloudflare 边缘证书。
# 源站证书使用 Cloudflare Origin Certificate（15 年有效期），固定放在：
#   /etc/nginx/ssl/jevcode.crt
#   /etc/nginx/ssl/jevcode.key
# 这样替换证书时无需改动本配置。
#
# Cloudflare SSL 模式需设为 Full (strict)：
#   用户 ←TLS→ Cloudflare ←TLS(校验源站证书)→ 源站
#
# 启用：ln -s /etc/nginx/sites-available/jevcode.conf /etc/nginx/sites-enabled/

# ---------- 限流区（必须位于 http 层）----------
# 本文件被 include 进 http 块，故 limit_req_zone 可放在文件顶层。
# 按客户端 IP 限流：每秒 5 次，突发 20。采集器是批量投递，此额度充裕。
limit_req_zone $binary_remote_addr zone=jevcode_intake:10m rate=5r/s;

# ---------- HTTP：ACME 校验 + 跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name www.jevcode.ai jevcode.ai;

    # 虽然走 DNS 校验，保留此项以防后续切换 HTTP 校验
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.jevcode.ai$request_uri;
    }
}

# ---------- API 子域：只对外暴露程序接口 ----------
# 用户注册后走 api.jevcode.ai 用 API key 调判定，不经过 www 的页面路由。
# 只放行 /v1/*（判定与用量）与 /api/auth/*（注册登录，供 SDK 拿会话），
# 其余一律 404——这个子域不提供任何静态页面。
#
# 前置条件（缺一不可，详见 deploy/API-SUBDOMAIN.md）：
#   1. TLS 证书 SAN 必须包含 api.jevcode.ai，否则 Cloudflare Full 模式回源
#      会因主机名不匹配报 526
#   2. Cloudflare DNS 里 api 记录必须是 proxied（橙云），否则没有边缘证书
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.jevcode.ai;

    ssl_certificate     /etc/nginx/ssl/jevcode.crt;
    ssl_certificate_key /etc/nginx/ssl/jevcode.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 64k;

    # 正式判定接口。这里是 product 的收费面，限流按 key 的用量在应用层做，
    # nginx 这层只挡明显的洪峰。
    location /v1/ {
        limit_req zone=jevcode_intake burst=40 nodelay;
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 注册/登录：便于 SDK 与第三方站点调用，同样走同一进程
    location /api/auth/ {
        limit_req zone=jevcode_intake burst=20 nodelay;
        limit_except GET POST { deny all; }
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}

# ---------- 裸域跳转到 www ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jevcode.ai;

    ssl_certificate     /etc/nginx/ssl/jevcode.crt;
    ssl_certificate_key /etc/nginx/ssl/jevcode.key;

    return 301 https://www.jevcode.ai$request_uri;
}

# ---------- 主站 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jevcode.ai;

    root /var/www/jevcode/current;
    index index.html;

    client_max_body_size 2m;

    ssl_certificate     /etc/nginx/ssl/jevcode.crt;
    ssl_certificate_key /etc/nginx/ssl/jevcode.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 注意：Cloudflare 侧若开启 Always Use HTTPS 和 HSTS，此处重复设置无害
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               image/svg+xml application/wasm;

    charset utf-8;

    # 带内容哈希的静态资源，长期缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(svg|woff2?|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # sitemap 与 robots 短缓存，便于爬虫及时看到更新
    location ~ ^/(sitemap.*\.xml|robots\.txt)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Web App Manifest 必须返回 application/manifest+json，
    # 否则 nginx 默认给 application/octet-stream，浏览器会拒绝解析。
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        expires 1h;
        add_header Cache-Control "public";
    }

    # 内容投递接口，反代到本机 127.0.0.1:8791 的 intake 服务。
    # 该服务只落盘、不解析内容；见 deploy/intake/README.md。
    location /api/intake {
        # 限流：见本文件外的 limit_req_zone 定义（http 层）
        limit_req zone=jevcode_intake burst=20 nodelay;
        limit_except POST { deny all; }

        # 请求体上限与 intake 服务内部校验形成两层防护
        client_max_body_size 1m;

        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 采集器可据此做来源审计；intake 服务本身不信任该头
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        access_log off;
    }

    # 访客判定。只反代这两条，密钥留在本机 playground 进程里。
    location = /api/try {
        limit_req zone=jevcode_intake burst=10 nodelay;
        limit_except POST { deny all; }
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 45s;
    }

    location = /api/compare/recent {
        limit_req zone=jevcode_intake burst=20 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    # 实时对比：一批最多 8 题，两边上游并行，所以读超时比单次判定宽。
    location = /api/compare {
        limit_req zone=jevcode_intake burst=8 nodelay;
        limit_except POST { deny all; }
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 分享页由同一个试用进程渲染。其余页面仍由静态文件直接提供。
    location ~ "^/(en|zh|ja|ko|de|fr|es|pt)/r/[a-z0-9]{12}/?$" {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 账号体系：注册/登录/登出/我是谁。反代到本机 8790 的 playground 进程。
    # 必须与页面同源——会话 Cookie 是 SameSite=Lax，跨源会被浏览器拦掉。
    location /api/auth/ {
        limit_req zone=jevcode_intake burst=20 nodelay;
        limit_except GET POST { deny all; }
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # API Key 签发与吊销
    location /api/keys {
        limit_req zone=jevcode_intake burst=10 nodelay;
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 其余 /api/* 一律不对外暴露
    location /api/ {
        return 404;
    }

    # 根路径直接 302 到默认语言（英文）。中文走 /zh/。
    # 静态构建下 Astro.redirect 只能生成带延迟的 meta refresh 白屏页，
    # 这里用 nginx 直接重定向，浏览器不会渲染任何中间页。
    location = / {
        return 302 /en/;
    }

    # 目录自动查找 index.html（Astro directory 输出格式）
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # HTML 不缓存，保证部署后立即生效
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
