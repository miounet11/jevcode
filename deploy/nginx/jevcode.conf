# JevCode 站点 nginx 配置
# 目标服务器：23.95.243.52 (Ubuntu 24.04, nginx/1.24.0)
# 放置位置：/etc/nginx/sites-available/jevcode.conf
#
# 注意：本服务器上已有 xiaoshuo（:80 default_server，server_name _）和
# manhua-kaifa（:18765）两个站点。本配置用显式 server_name 精确匹配，
# 因此不会与它们冲突——nginx 会优先选择 server_name 精确匹配的 server 块。
#
# 证书：站点走 Cloudflare 代理，浏览器看到的是 Cloudflare 边缘证书。
# 源站证书使用 Cloudflare Origin Certificate（15 年有效期），固定放在：
#   /etc/nginx/ssl/jevcode.crt
#   /etc/nginx/ssl/jevcode.key
# 这样替换证书时无需改动本配置。
#
# Cloudflare SSL 模式需设为 Full (strict)：
#   用户 ←TLS→ Cloudflare ←TLS(校验源站证书)→ 源站
#
# 启用：ln -s /etc/nginx/sites-available/jevcode.conf /etc/nginx/sites-enabled/

# ---------- HTTP：ACME 校验 + 跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name www.jevcode.ai jevcode.ai;

    # 虽然走 DNS 校验，保留此项以防后续切换 HTTP 校验
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.jevcode.ai$request_uri;
    }
}

# ---------- 裸域跳转到 www ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jevcode.ai;

    ssl_certificate     /etc/nginx/ssl/jevcode.crt;
    ssl_certificate_key /etc/nginx/ssl/jevcode.key;

    return 301 https://www.jevcode.ai$request_uri;
}

# ---------- 主站 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jevcode.ai;

    root /var/www/jevcode/current;
    index index.html;

    client_max_body_size 2m;

    ssl_certificate     /etc/nginx/ssl/jevcode.crt;
    ssl_certificate_key /etc/nginx/ssl/jevcode.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 注意：Cloudflare 侧若开启 Always Use HTTPS 和 HSTS，此处重复设置无害
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               image/svg+xml application/wasm;

    charset utf-8;

    # 带内容哈希的静态资源，长期缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(svg|woff2?|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # sitemap 与 robots 短缓存，便于爬虫及时看到更新
    location ~ ^/(sitemap.*\.xml|robots\.txt)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # 根路径直接 302 到默认语言。
    # 静态构建下 Astro.redirect 只能生成带延迟的 meta refresh 白屏页，
    # 这里用 nginx 直接重定向，浏览器不会渲染任何中间页。
    location = / {
        return 302 /zh/;
    }

    # 目录自动查找 index.html（Astro directory 输出格式）
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # HTML 不缓存，保证部署后立即生效
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
